<div [class]="outLetClasses">




<div class="screen-overlay {{offcanvasClass}}" (mousedown)="hideSidebar()"></div>

<aside class="navbar-aside {{asideClass}}"  id="offcanvas_aside">
    <div class="aside-top">
        <a class="brand-wrap"><img class="logo" src="https://cdn.kafegy.com/Esnawy/assets/assets/imgs/Logo.png" routerLink="/" alt="Home"></a>
        <div>
            <button class="btn btn-icon btn-aside-minimize" (click)="changeSideStatus()"><i
                    class="text-muted material-icons md-menu_open"></i></button>
        </div>
    </div>
    <nav>
        <ul class="menu-aside">
            <li class="menu-item">
    <a class="menu-link " aria-current="page" routerLink="/client/overview" routerLinkActive="active">
        <i class="icon material-icons md-home"></i>

        <span class="text">Overview</span>

    </a>
</li>

<li class="menu-item">
    <a class="menu-link" routerLink="/client/shop" routerLinkActive="active">
        <i class="icon material-icons md-shopping_bag "></i>

        <span class="text">Shop</span>

    </a>
</li>
<li class="menu-item">
    <a class="menu-link" routerLink="/client/settings" routerLinkActive="active">
        <i class="icon material-icons md-shopping_bag "></i>

        <span class="text">settings</span>

    </a>
</li>
        </ul>

    </nav>
</aside>
<main [class]="mainClass">
    <app-header  (offCanvasClicked)="showSideBar()"></app-header>


    <div class="container">

        <router-outlet></router-outlet>
        <app-footer></app-footer>
    </div>

</main>
</div>
