version: '3.8'

services:
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - monitoring

  # Grafana LGTM stack (Log, Grafana, Tempo, Mimir/Prometheus) accepts OTLP natively on port 4317/4318
  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: otel-lgtm
    ports:
      - "3000:3000" # If you prefer the all-in-one Grafana UI from LGTM, or use port 3000 above
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge